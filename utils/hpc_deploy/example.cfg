# Settings for hpc_deploy.py.  Copy this file to
# ~/.config/e3sm_unified_deploy.cfg on your own computer, and fill it in.

# The machines reached over ssh, each as
#   <machine> = <ssh host>:<e3sm-unified checkout on the machine>
# with the machine as mache names it, and the host an alias in your
# ~/.ssh/config that shares the connection you open by logging in.  The path
# may start with ~.  Leave out Frontier, which does not allow shared
# connections.
[machines]
# aurora = <host>:~/e3sm-unified
# chrysalis = <host>:~/e3sm-unified
# pm-cpu = <host>:~/e3sm-unified

# The command that submits a machine's compute-node test, if the one made
# from the [parallel] section of mache's config for the machine will not do,
# for example because your account is different
[compute_job]
# aurora = qsub -A <project> -q debug -l select=1 -l walltime=00:30:00 -l filesystems=home:flare
